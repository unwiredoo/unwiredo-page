    <main>
        <section id="contact-me">
            <h1>contact</h1>
            <p>if you have good questions, collab ideas or really just want to hi you can drop a message bellow...</p>
        </section>

        <form action="https://formsubmit.co/cb86820a37359c1a4193ef4b87cca7f0" method="POST" class="contact-form" target="_blank">

            <div class="form-row">

              <div class="form-field">
                <input class="contact-field" type="text" id="name" name="name" placeholder="name" required>
              </div>

              
              <div class="form-field">
                <input class="contact-field" type="text" type="email" id="email" name="email" placeholder="email" required>
              </div>
              
            </div>

            <div class="form-message">
              <div class="form-field">
                <textarea placeholder="your message" class="input-message" name="message" id="message" rows="8" required></textarea>
              </div>
            </div>


            <div class="form-actions">
              <button class="submit-button" type="submit" >submit</button>
            </div>
        </form>
